<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">Rabbitastro โหรกระต่าย</title><desc id="desc">มูน่ากระต่ายนักพยากรณ์ในชุดคลุมสีม่วง ถือคริสตัลบอล ล้อมด้วยพระจันทร์และดวงดาว</desc>
